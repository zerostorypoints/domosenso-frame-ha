- id: workbench.station_temperature
  revision: 1
  title: {en: Workbench temperature, de: Werkbanktemperatur, pl: Temperatura przy stole roboczym}
  description: {en: Read the temperature at the workbench, de: Temperatur an der Werkbank, pl: Sprawdź temperaturę przy stole roboczym}
  examples:
    en: ["How warm is the workbench in {area}?"]
    de: ["Wie warm ist die Werkbank in {area}?"]
    pl: ["Jaka jest temperatura przy stole roboczym w {area}?"]
  anchors:
    en: [workbench]
    de: [Werkbank]
    pl: [stół roboczy, stole roboczym]
  source:
    role: temperature
    relation: upstream
    id: sensor.workbench_<id>
  evaluator:
    kind: measurement
    unit: "°C"
    aggregate: mean
    maxAgeSeconds: 300
  selectors: [area]
- id: workbench.probe_temperature
  revision: 1
  title: {en: Probe temperature, de: Sondentemperatur, pl: Temperatura sondy}
  description: {en: Read the temperature at a probe, de: Temperatur einer Sonde, pl: Sprawdź temperaturę sondy}
  examples:
    en: ["What is the temperature at {subject}?"]
    de: ["Wie warm ist {subject}?"]
    pl: ["Jaka jest temperatura sondy {subject}?"]
  anchors:
    en: [probe]
    de: [Sonde]
    pl: [sonda, sondy]
  source:
    role: temperature
    relation: upstream
    id: sensor.workbench_<id>
  evaluator:
    kind: measurement
    unit: "°C"
    aggregate: none
    maxAgeSeconds: 300
  selectors: [subject]
